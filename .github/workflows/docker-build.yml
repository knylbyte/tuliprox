name: Docker Build and Push

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      branch:
        type: choice
        description: Target branch
        options: [develop, experimental, master]
        default: develop
      choice:
        type: choice
        description: Version bump
        options: [none, major, minor, patch]
        default: none
  push:
    branches: [develop, experimental, master]

# Avoid multiple parallel builds for the same branch to prevent race conditions
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: false # Set to true if you want to abort old builds immediately

jobs:
  docker-build:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/experimental' || github.ref == 'refs/heads/master') &&
      (github.event_name != 'push' || github.actor != 'github-actions[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Ensure we always have the right branch context
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Install Rust Tools (Binaries)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cross,trunk,wasm-bindgen-cli,cargo-edit,mdbook

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,wasm32-unknown-unknown

      - name: Install wasm tools 128
        run: |
          chmod +x ./bin/install_wasm_tools.sh
          WASM_TOOLS_BIN="$(./bin/install_wasm_tools.sh 128)"
          echo "${WASM_TOOLS_BIN}" >> "$GITHUB_PATH"

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: "true"

      - name: Handle Version Bump
        run: |
          chmod +x ./bin/inc_version.sh
          if [[ "${{ github.event_name }}" == "push" ]]; then
            case "${{ github.ref_name }}" in
              develop) ./bin/inc_version.sh ;;
              experimental) echo "🔬 Experimental builds do not bump versions; keeping version from develop." ;;
              master) echo "Master builds use the version already committed in the merged PR; skipping version bump." ;;
              *) echo "Unsupported push branch: ${{ github.ref_name }}" >&2; exit 1 ;;
            esac
          else
            if [[ "${{ github.event.inputs.branch }}" == "master" || "${{ github.event.inputs.branch }}" == "experimental" ]]; then
              echo "Manual ${{ github.event.inputs.branch }} builds skip version bump."
            else
              case "${{ github.event.inputs.choice }}" in
                major) ./bin/inc_version.sh m ;;
                minor) ./bin/inc_version.sh p ;;
                patch) ./bin/inc_version.sh ;;
              esac
            fi
          fi

      - name: Read project version
        id: version
        run: |
          VERSION=$(grep -Po '^version\s*=\s*"\K[0-9\.]+' ./Cargo.toml)
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Enforce zero patch for master releases
        if: >-
          (github.event_name == 'workflow_dispatch' && github.event.inputs.branch == 'master') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          IFS='.' read -r major minor patch <<< "${VERSION}"
          if [[ -z "${major}" || -z "${minor}" || -z "${patch}" ]]; then
            echo "🧨 Invalid semantic version: ${VERSION}" >&2
            exit 1
          fi
          if [[ "${patch}" != "0" ]]; then
            echo "🧨 Refusing master release for non-release version ${VERSION}. Patch component must be 0." >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Cache built resources
        id: cache-resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/*.ts
          key: ${{ runner.os }}-resources-${{ hashFiles('resources/*.jpg') }}

      - name: Install ffmpeg
        if: steps.cache-resources.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build TS resources
        if: steps.cache-resources.outputs.cache-hit != 'true'
        run: |
          chmod +x ./bin/build_resources.sh
          ./bin/build_resources.sh

      - name: Verify TS resources
        run: |
          required_resources=(
            "channel_unavailable"
            "user_connections_exhausted"
            "provider_connections_exhausted"
            "user_account_expired"
            "panel_api_provisioning"
            "maintenance"
          )
          for resource in "${required_resources[@]}"; do
            if [[ ! -f "resources/${resource}.ts" ]]; then
              echo "🧨 Missing resource: resources/${resource}.ts"
              exit 1
            fi
          done
      - name: Commit version bump
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.branch == 'develop' && github.event.inputs.choice != 'none')
        id: version_commit
        run: |
          git config user.name "euzu"
          git config user.email "euzu@proton.me"
          echo "base_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git add -- Cargo.toml Cargo.lock frontend/Cargo.toml
          if git diff --cached --quiet; then
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -Po '^version\s*=\s*"\K[0-9\.]+' ./Cargo.toml | head -n1)
            git commit --only -m "ci: bump version v$VERSION" -- Cargo.toml Cargo.lock frontend/Cargo.toml
            echo "did_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release tag
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [[ "$RELEASE_BRANCH" == "experimental" ]]; then
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            if [[ "$(git rev-parse "refs/tags/v$VERSION^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Refusing to replace v$VERSION: the tag belongs to a different commit." >&2
              exit 1
            fi
          else
            git config user.name "euzu"
            git config user.email "euzu@proton.me"
            git tag -a "v$VERSION" -m "v$VERSION"
          fi

      - name: Build release bundles and Docker context
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
        run: |
          chmod +x ./bin/build_docker.sh
          ./bin/build_docker.sh "$RELEASE_BRANCH" build

      - name: Verify release bundle artifacts
        run: |
          ls -la artifacts
          for arch in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            artifact="artifacts/tuliprox-v${{ steps.version.outputs.value }}-${arch}.tar.gz"
            test -f "${artifact}"
            test -f "${artifact}.sha256"
            for required_path in tuliprox/tuliprox tuliprox/web/ tuliprox/resources/; do
              tar -tzf "${artifact}" | grep -qx "${required_path}"
            done
          done
          for sum_file in artifacts/*.sha256; do
            (cd artifacts && sha256sum -c "$(basename "$sum_file")")
          done

      - name: Build release checksum notes
        run: |
          {
            echo "## Release Bundle Checksums"
            echo
            echo "The checksums below were validated in CI via \`sha256sum -c\` before upload."
            echo
            echo "| File | SHA256 |"
            echo "| --- | --- |"
            for sum_file in artifacts/*.sha256; do
              checksum=$(awk '{print $1}' "$sum_file")
              filename=$(awk '{print $2}' "$sum_file")
              echo "| \`$filename\` | \`$checksum\` |"
            done
            echo
            echo "Verification command after download:"
            echo "\`\`\`bash"
            echo "sha256sum -c *.sha256"
            echo "\`\`\`"
          } > artifacts/RELEASE_NOTES_SHA256.md

      - name: Publish version commit and tag
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
          BASE_COMMIT: ${{ steps.version_commit.outputs.base_commit }}
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Refusing to publish: tracked files changed after the version commit." >&2
            exit 1
          fi
          expected_commit="${BASE_COMMIT:-$(git rev-parse HEAD)}"
          remote_commit=$(git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')
          if [[ "$remote_commit" != "$expected_commit" ]]; then
            echo "Refusing to publish: $RELEASE_BRANCH changed during the build. Start a new run from the current branch." >&2
            exit 1
          fi
          if [[ "$RELEASE_BRANCH" != "experimental" ]]; then
            git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$VERSION:refs/tags/v$VERSION"
          fi

      - name: Publish Docker images
        env:
          GITHUB_IO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
        run: |
          ./bin/build_docker.sh "$RELEASE_BRANCH" publish

      - name: Upload release bundle artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuliprox-release-v${{ steps.version.outputs.value }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release bundles to GitHub Release
        if: >-
          success() && (
            (github.event_name == 'workflow_dispatch' && github.event.inputs.branch == 'master') ||
            (github.event_name == 'push' && github.ref == 'refs/heads/master')
          )
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          files: |
            artifacts/tuliprox-v${{ steps.version.outputs.value }}-x86_64-unknown-linux-musl.tar.gz
            artifacts/tuliprox-v${{ steps.version.outputs.value }}-x86_64-unknown-linux-musl.tar.gz.sha256
            artifacts/tuliprox-v${{ steps.version.outputs.value }}-aarch64-unknown-linux-musl.tar.gz
            artifacts/tuliprox-v${{ steps.version.outputs.value }}-aarch64-unknown-linux-musl.tar.gz.sha256
          body_path: artifacts/RELEASE_NOTES_SHA256.md
          generate_release_notes: true
